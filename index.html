<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Divyanshu Gupta — Automation Engineer · n8n Verified Creator</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700;800&display=swap" />

<style>
  :root {
    --bg: #0a0a0d;
    --bg-2: #111116;
    --surface: #16161d;
    --surface-2: #1c1c25;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #f5f4ef;
    --ink-dim: rgba(245,244,239,0.66);
    --ink-mute: rgba(245,244,239,0.42);
    --accent: #ea4b71;          /* n8n pink */
    --accent-2: #ff6e5b;        /* warm orange */
    --accent-soft: rgba(234,75,113,0.14);
    --accent-line: rgba(234,75,113,0.32);
    --good: #5be0a0;
    --container: 1240px;
    --pad-x: clamp(20px, 4vw, 56px);
    --section-pad-y: clamp(80px, 9vw, 140px);
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 22px;
    --shadow-soft: 0 1px 0 rgba(255,255,255,0.04) inset, 0 24px 60px -30px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: white; }

  /* type */
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; }
  .serif-i { font-family: "Instrument Serif", "Times New Roman", serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  h1, h2, h3, h4 { letter-spacing: -0.025em; font-weight: 600; margin: 0; text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: inherit; text-decoration: none; }

  /* container */
  .container {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 var(--pad-x);
  }

  /* eyebrow / kicker */
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .kicker::before {
    content: "";
    width: 18px;
    height: 1px;
    background: var(--accent);
  }

  /* generic button */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 14.5px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    font-family: inherit;
    line-height: 1;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 10px 30px -10px rgba(234,75,113,0.6), 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  .btn-primary:hover { transform: translateY(-1px); background: #f15b80; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--ink-dim); background: rgba(255,255,255,0.03); }
  .btn .arrow { transition: transform 0.2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* section header */
  .section { padding: var(--section-pad-y) 0; position: relative; }
  .section + .section { border-top: 1px solid var(--line); }

  /* density */
  body[data-density="compact"] { --section-pad-y: clamp(60px, 7vw, 100px); }
  body[data-density="comfy"]   { --section-pad-y: clamp(110px, 12vw, 180px); }

  /* focus */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* utility */
  .stack { display: flex; flex-direction: column; }
  .row   { display: flex; }
  .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
  .gap-6 { gap: 24px; } .gap-8 { gap: 32px; }
  .center-y { align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  /* chip */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .chip-dot {
    width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
  }

  /* dotted-grid background for hero */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: 0 0;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black, transparent);
    pointer-events: none;
  }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    background: rgba(10,10,13,0.6);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px var(--pad-x);
    max-width: var(--container);
    margin: 0 auto;
  }
  .nav-logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 15px; letter-spacing: -0.02em;
    text-decoration: none;
  }
  .nav-logo .mark {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--ink);
    color: white;
    flex-shrink: 0;
    overflow: hidden;
  }
  .nav-logo .wordmark {
    display: flex; flex-direction: column; line-height: 1;
    gap: 1px;
  }
  .nav-logo .wordmark-name {
    font-size: 14px; font-weight: 700; letter-spacing: -0.03em;
    color: var(--ink);
  }
  .nav-logo .wordmark-role {
    font-size: 10px; font-weight: 400; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 14px; color: var(--ink-dim);
    transition: color 0.18s ease;
  }
  .nav-links a:hover { color: var(--ink); }
  @media (max-width: 760px) {
    .nav-links { display: none; }
  }

  /* hero */
  .hero {
    position: relative;
    padding: clamp(60px, 10vw, 120px) 0 clamp(80px, 10vw, 140px);
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: clamp(40px, 6vw, 80px);
    align-items: center;
    position: relative;
  }
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; }
  }
  .hero h1 {
    font-size: clamp(34px, 4.6vw, 60px);
    line-height: 1.04;
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  .hero h1 .serif-i {
    font-size: 1.02em;
    line-height: 1;
    color: var(--accent-2);
  }
  .hero-sub {
    margin-top: 28px;
    font-size: clamp(16px, 1.4vw, 19px);
    line-height: 1.55;
    color: var(--ink-dim);
    max-width: 560px;
  }
  .hero-cta {
    margin-top: 36px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .hero-meta {
    margin-top: 40px;
    display: flex; align-items: center; gap: 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-mute);
    flex-wrap: wrap;
  }
  .hero-meta .dot { width: 4px; height: 4px; border-radius: 99px; background: var(--ink-mute); }
  .hero-meta a:hover { color: var(--ink); }

  .availability {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--line-strong);
    background: rgba(91,224,160,0.06);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .hero-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
  .award-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255,184,74,0.42);
    background: linear-gradient(90deg, rgba(255,184,74,0.16), rgba(255,110,91,0.08));
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px; letter-spacing: 0.04em;
    color: #ffd9a0; text-transform: uppercase;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .award-badge:hover { border-color: rgba(255,184,74,0.8); transform: translateY(-1px); }
  .award-badge .t { font-size: 13px; line-height: 1; }
  .availability .pulse {
    width: 8px; height: 8px; border-radius: 99px; background: var(--good);
    box-shadow: 0 0 0 0 rgba(91,224,160,0.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(91,224,160,0.7); }
    70% { box-shadow: 0 0 0 10px rgba(91,224,160,0); }
    100% { box-shadow: 0 0 0 0 rgba(91,224,160,0); }
  }

  /* marquee strip */
  .marquee-strip {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    overflow: hidden;
    background: var(--bg-2);
  }
  .marquee {
    display: flex;
    gap: 56px;
    white-space: nowrap;
    animation: scroll 40s linear infinite;
    width: max-content;
  }
  .marquee span {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-mute);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .marquee span::before {
    content: "✦"; color: var(--accent); font-size: 11px;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* section title */
  .section-title {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: clamp(20px, 4vw, 60px);
    align-items: end;
    margin-bottom: clamp(40px, 5vw, 70px);
  }
  @media (max-width: 760px) {
    .section-title { grid-template-columns: 1fr; align-items: start; }
  }
  .section-title h2 {
    font-size: clamp(32px, 4.4vw, 56px);
    line-height: 1.02;
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  .section-title h2 .serif-i {
    color: var(--accent-2);
    font-size: 1.05em;
  }
  .section-title .lede {
    font-size: clamp(15px, 1.2vw, 17px);
    color: var(--ink-dim);
    line-height: 1.55;
    max-width: 520px;
  }

  /* services */
  .services {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--surface);
  }
  @media (max-width: 940px) { .services { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .services { grid-template-columns: 1fr; } }
  .service {
    padding: 30px 28px 28px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    transition: background 0.2s ease;
    position: relative;
  }
  .service:hover { background: var(--surface-2); }
  .services .service:nth-child(3n) { border-right: none; }
  .services .service:nth-last-child(-n+3) { border-bottom: none; }
  @media (max-width: 940px) {
    .services .service:nth-child(3n) { border-right: 1px solid var(--line); }
    .services .service:nth-child(2n) { border-right: none; }
    .services .service:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
    .services .service:nth-last-child(-n+2) { border-bottom: none; }
  }
  @media (max-width: 620px) {
    .services .service { border-right: none !important; border-bottom: 1px solid var(--line) !important; }
    .services .service:last-child { border-bottom: none !important; }
  }
  .service .num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
  }
  .service h3 {
    margin-top: 18px;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .service p {
    margin-top: 12px;
    font-size: 14.5px;
    color: var(--ink-dim);
    line-height: 1.55;
  }
  .service-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    display: grid; place-items: center;
    color: var(--accent);
    margin-bottom: 18px;
  }

  /* stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  @media (max-width: 740px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    padding: 36px 24px;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .stat:last-child { border-right: none; }
  @media (max-width: 740px) {
    .stat:nth-child(2n) { border-right: none; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  }
  .stat .num-big {
    font-family: "Geist", sans-serif;
    font-size: clamp(40px, 4.4vw, 56px);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
    display: flex; align-items: baseline; gap: 4px;
  }
  .stat .num-big .suffix {
    font-size: 0.5em;
    color: var(--accent);
    font-weight: 500;
  }
  .stat .lbl {
    margin-top: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-mute);
  }

  /* workflows */
  .workflows { display: flex; flex-direction: column; gap: 32px; }
  .workflow {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--surface);
  }
  @media (max-width: 940px) { .workflow { grid-template-columns: 1fr; } }
  .wf-media {
    position: relative;
    background: #050507;
    aspect-ratio: 16/10;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  @media (max-width: 940px) { .wf-media { border-right: none; border-bottom: 1px solid var(--line); } }
  .wf-media video, .wf-media .wf-poster {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .wf-poster {
    position: relative;
    background:
      radial-gradient(circle at 30% 20%, rgba(234,75,113,0.18), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(255,110,91,0.12), transparent 50%),
      linear-gradient(135deg, #0d0d12, #14141d);
    display: grid; place-items: center;
    color: var(--ink-dim);
  }
  .wf-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 999px;
    background: rgba(255,255,255,0.96);
    color: #111;
    display: grid; place-items: center;
    cursor: pointer;
    border: none;
    transition: transform 0.18s ease;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .wf-play:hover { transform: translate(-50%, -50%) scale(1.05); }
  .wf-play svg { margin-left: 4px; }
  .wf-tag {
    position: absolute; top: 16px; left: 16px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink);
  }
  .wf-tag .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }

  /* workflow node-flow diagram (replaces video) */
  .wf-canvas {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 38%, rgba(234,75,113,0.12), transparent 62%),
      linear-gradient(135deg, #0c0c11, #14141d);
  }
  .wf-canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .wf-flow {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0 22px 26px;
  }
  .wf-node {
    position: relative;
    width: 58px; height: 46px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .wf-node-box {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: rgba(20,20,27,0.96);
    border: 1px solid rgba(255,255,255,0.12);
    display: grid; place-items: center;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.6);
  }
  .wf-node-mono {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600; font-size: 15px;
  }
  .wf-node-more {
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }
  .wf-node-more .wf-node-mono { color: var(--accent); }
  .wf-node-label {
    position: absolute; top: 52px; left: 50%;
    transform: translateX(-50%);
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px; letter-spacing: 0.02em;
    color: var(--ink-dim);
    white-space: nowrap; line-height: 1;
  }
  .wf-connector {
    position: relative;
    flex: 1 1 auto; min-width: 14px; max-width: 34px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  }
  .wf-spark {
    position: absolute; top: 50%; left: 0;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--accent);
    animation: wfSpark 2.4s linear infinite;
  }
  @keyframes wfSpark {
    0%   { left: 0%;   opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .wf-spark { animation: none; opacity: 0; } }
  .wf-open {
    position: absolute; right: 14px; bottom: 14px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--ink);
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .wf-media { cursor: pointer; display: block; }
  .wf-media:hover .wf-open { opacity: 1; transform: none; }
  .wf-media-img { padding: 0; border: none; background: #0a0a0d; }
  .wf-media-img img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: left top;
    transition: transform 0.4s ease;
  }
  .wf-media-img:hover img { transform: scale(1.02); }

  .wf-likes {
    margin-left: 10px;
    color: var(--accent);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
  }
  .wf-link {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--accent-2);
    transition: gap 0.2s ease, color 0.2s ease;
    width: fit-content;
  }
  .wf-link:hover { gap: 12px; color: var(--accent); }
  .wf-link .arrow { transition: transform 0.2s ease; }
  .wf-links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 6px; }
  .wf-link-li { color: var(--ink-dim); }
  .wf-link-li:hover { color: #5dade2; }

  /* ── featured / award-winning workflow ───────────────────────────────── */
  .featured-wf {
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background:
      radial-gradient(circle at 85% 0%, rgba(234,75,113,0.12), transparent 45%),
      var(--surface);
    box-shadow: 0 30px 80px -50px rgba(234,75,113,0.5);
